<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Chúc mừng tốt nghiệp • Orenji 🍊</title>
<meta name="description" content="Một điều nhỏ dành cho ngày tốt nghiệp của Orenji." />
<meta name="theme-color" content="#e9dcc0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%8A%3C/text%3E%3C/svg%3E" />
<meta property="og:title" content="Chúc mừng tốt nghiệp • Orenji 🍊" />
<meta property="og:description" content="Một điều nhỏ dành cho ngày cậu tốt nghiệp." />
<meta property="og:image" content="assets/poster.webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Caveat:wght@500;700&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese,latin" rel="stylesheet" />
<style>
  :root{
    --paper:#ece0c6; --paper-2:#e2d2ae; --ink:#241d14; --ink-soft:#4a3d2c;
    --kraft:#d9b98a; --kraft-2:#c69a63;
    --orange:#ef7f1a; --orange-2:#ff9c3d; --gold:#d7a521; --gold-2:#f1cf5f;
    --rose:#b23a34; --plum:#9a6aae; --sage:#7f9c6b;
    --shadow:rgba(60,42,20,.35);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:"Be Vietnam Pro", system-ui, sans-serif;
    background:#0e0b07; color:var(--ink);
    overflow:hidden; position:fixed; inset:0;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  img{ -webkit-user-drag:none; user-select:none; }

  /* ---------- ambient stage background ---------- */
  #ambient{
    position:fixed; inset:0; z-index:1;
    background:
      radial-gradient(120% 90% at 50% 18%, #f6ecd6 0%, #e7d6b4 42%, #cdb488 78%, #a9895c 100%);
  }
  #ambient::after{ /* soft warm glow blooming from the subject */
    content:""; position:absolute; inset:0;
    background:radial-gradient(46% 55% at 74% 60%, rgba(255,178,90,.42), rgba(255,178,90,0) 60%),
               radial-gradient(60% 60% at 30% 40%, rgba(255,238,200,.35), rgba(255,238,200,0) 65%);
    mix-blend-mode:screen; opacity:.9;
  }

  /* ---------- the framed poster + cut-out subject ---------- */
  #frameCenter{ position:fixed; inset:0; z-index:2; display:grid; place-items:center; pointer-events:none; }
  #frame{
    position:relative;
    width:min(100vw, 141.3vh);
    aspect-ratio:2600 / 1840;
    will-change:transform;
  }
  #poster, #girl{ position:absolute; will-change:transform; backface-visibility:hidden; }
  #poster{
    inset:0; width:100%; height:100%;
    z-index:10; border-radius:2px;
    box-shadow:0 30px 70px -30px rgba(40,26,8,.7), 0 8px 24px -12px rgba(40,26,8,.5);
    transform-origin:50% 50%;
  }
  #girl{
    left:62.64%; top:24.493%; width:34.89%; height:auto;
    z-index:20; transform-origin:50% 90%;
    filter:drop-shadow(-10px 18px 22px rgba(35,20,6,.42));
  }

  /* particle canvases: back sits between poster and girl, front over everything */
  #fxBack{ position:fixed; inset:0; z-index:15; pointer-events:none; }
  #fxFront{ position:fixed; inset:0; z-index:30; pointer-events:none; }

  /* ---------- cinematic overlays (anti-flat) ---------- */
  #rays{ position:fixed; inset:-20%; z-index:34; pointer-events:none; mix-blend-mode:screen; opacity:.5;
    background:conic-gradient(from 200deg at 72% 34%,
      rgba(255,214,140,0) 0deg, rgba(255,214,140,.16) 12deg, rgba(255,214,140,0) 26deg,
      rgba(255,214,140,0) 60deg, rgba(255,226,170,.12) 74deg, rgba(255,226,170,0) 92deg,
      rgba(255,214,140,0) 360deg);
    animation:rayspin 60s linear infinite;
  }
  @keyframes rayspin{ to{ transform:rotate(360deg);} }
  #vignette{ position:fixed; inset:0; z-index:36; pointer-events:none;
    background:radial-gradient(120% 100% at 50% 42%, rgba(0,0,0,0) 52%, rgba(38,24,8,.28) 82%, rgba(24,14,4,.6) 100%);
  }
  #grain{ position:fixed; inset:0; z-index:38; pointer-events:none; opacity:.06; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:220px 220px; animation:grainshift 1.6s steps(3) infinite;
  }
  @keyframes grainshift{ 0%{transform:translate(0,0)} 33%{transform:translate(-6px,4px)} 66%{transform:translate(4px,-5px)} 100%{transform:translate(0,0)} }

  /* ---------- UI chrome ---------- */
  #ui{ position:fixed; z-index:50; inset:0; pointer-events:none; }
  .btn{
    pointer-events:auto; position:absolute; top:calc(env(safe-area-inset-top,0) + 16px); right:16px;
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(60,42,20,.25);
    background:rgba(247,238,218,.72); backdrop-filter:blur(6px);
    display:grid; place-items:center; cursor:pointer; color:var(--ink-soft);
    box-shadow:0 6px 16px -8px var(--shadow); transition:transform .2s ease, background .2s;
  }
  .btn:hover{ transform:scale(1.06); background:rgba(247,238,218,.92); }
  .btn svg{ width:20px; height:20px; }
  #hint{
    position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0) + 22px); transform:translateX(-50%);
    font-family:"Caveat", cursive; font-size:clamp(17px,2.4vw,22px); color:var(--ink-soft);
    letter-spacing:.02em; opacity:0; transition:opacity 1s ease; text-align:center;
    text-shadow:0 1px 0 rgba(255,248,232,.6); white-space:nowrap;
  }
  #hint.show{ opacity:.85; }
  #hint.fade{ opacity:0; }
  #signature{
    position:absolute; right:clamp(14px,3vw,42px); bottom:calc(env(safe-area-inset-bottom,0) + 16px);
    font-family:"Caveat", cursive; font-size:clamp(19px,2.6vw,28px); color:#7a4d1c;
    opacity:0; transform:translateY(8px); transition:opacity 1.2s ease, transform 1.2s ease;
    text-shadow:0 1px 0 rgba(255,248,232,.5);
  }
  #signature.show{ opacity:.92; transform:none; }

  /* ---------- INTRO: the sealed letter ---------- */
  #intro{
    position:fixed; inset:0; z-index:100; display:grid; place-items:center;
    background:
      radial-gradient(120% 120% at 50% 30%, #f7edd6 0%, #e8d6b2 55%, #c9a877 100%);
    box-shadow:inset 0 0 220px 70px rgba(120,80,30,.2);
    cursor:pointer; overflow:hidden;
    transition:opacity 1.1s ease, transform 1.2s cubic-bezier(.2,.7,.2,1), filter 1.1s ease;
  }
  #intro .paper-grain{ position:absolute; inset:0; opacity:.08; mix-blend-mode:multiply; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  #intro.gone{ opacity:0; transform:scale(1.12); filter:blur(8px); pointer-events:none; }

  .intro-stack{ position:relative; display:flex; flex-direction:column; align-items:center; gap:26px; padding:24px; text-align:center; }
  .kicker{ font-family:"Caveat",cursive; font-size:clamp(20px,3.4vw,30px); color:#a85f18; letter-spacing:.04em;
    transform:rotate(-2deg); }
  .kicker b{ color:var(--orange); font-weight:700; }

  /* envelope */
  .env{ position:relative; width:min(78vw,360px); aspect-ratio:3/2; transform:rotate(-2.2deg);
    filter:drop-shadow(0 26px 40px rgba(60,40,14,.4)); }
  .env-body{ position:absolute; inset:0; border-radius:7px;
    background:linear-gradient(160deg, #e7c79a 0%, #d9b17f 55%, #cda06a 100%);
    border:1px solid rgba(120,84,40,.35);
    box-shadow:inset 0 2px 0 rgba(255,244,222,.5), inset 0 -18px 40px rgba(120,80,36,.22);
    overflow:hidden;
  }
  .env-body::before{ content:""; position:absolute; inset:0; opacity:.5; mix-blend-mode:multiply;
    background:repeating-linear-gradient(135deg, rgba(150,108,58,.08) 0 3px, rgba(150,108,58,0) 3px 7px); }
  /* the two diagonal pocket seams */
  .env-seam{ position:absolute; inset:0; }
  .env-seam::before,.env-seam::after{ content:""; position:absolute; left:0; right:0; top:0; bottom:0; }
  .env-seam::before{ background:linear-gradient(to bottom right, transparent 49.6%, rgba(120,82,40,.28) 49.8%, transparent 50%); }
  .env-seam::after{ background:linear-gradient(to bottom left, transparent 49.6%, rgba(120,82,40,.28) 49.8%, transparent 50%); }
  /* letter card that rises out — hidden inside the envelope at rest */
  .letter{ position:absolute; left:17%; right:17%; top:5%; height:84%; overflow:hidden;
    background:linear-gradient(180deg,#fdf7ea,#f3e7cf); border-radius:4px 4px 3px 3px;
    box-shadow:0 -6px 18px rgba(80,54,20,.18), inset 0 0 0 1px rgba(180,150,100,.25);
    transform:translateY(0); transition:transform 1s cubic-bezier(.2,.8,.2,1); z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:6% 8%;
  }
  .letter .l-title{ font-size:clamp(15px,2.1vw,19px) !important; line-height:1.2; }
  .letter .l-orange{ font-size:clamp(20px,3.2vw,28px) !important; }
  /* front pocket that keeps the letter tucked away until opened */
  .pocket{ position:absolute; inset:0; z-index:4; border-radius:0 0 7px 7px;
    background:linear-gradient(160deg,#e2bd8f 0%, #d3a468 70%, #c99a5e 100%);
    clip-path:polygon(0 16%, 50% 1%, 100% 16%, 100% 100%, 0 100%);
    box-shadow:inset 0 10px 20px rgba(120,80,36,.16);
  }
  .pocket::before{ content:""; position:absolute; inset:0; opacity:.5; mix-blend-mode:multiply;
    background:repeating-linear-gradient(135deg, rgba(150,108,58,.07) 0 3px, rgba(150,108,58,0) 3px 7px);
    clip-path:polygon(0 16%, 50% 1%, 100% 16%, 100% 100%, 0 100%); }
  .letter .l-title{ font-family:"Playfair Display",serif; font-weight:700; font-size:clamp(19px,3vw,26px); color:#3a2c18; line-height:1.15; }
  .letter .l-sub{ font-family:"Be Vietnam Pro",sans-serif; font-weight:300; font-size:clamp(12px,1.7vw,14px); color:#6c5836; }
  .letter .l-orange{ font-family:"Caveat",cursive; font-weight:700; font-size:clamp(26px,4.4vw,38px); color:var(--orange); margin-top:2px; }
  /* flap */
  .flap{ position:absolute; left:0; right:0; top:0; height:56%; z-index:5; transform-origin:50% 0%;
    transition:transform 1s cubic-bezier(.5,0,.2,1); transform-style:preserve-3d; }
  .flap::before{ content:""; position:absolute; left:0; right:0; top:0; bottom:0;
    background:linear-gradient(165deg,#ecca9d 0%,#d7ac72 100%);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    border-bottom:0; filter:drop-shadow(0 4px 6px rgba(90,60,26,.25));
  }
  /* wax seal */
  .seal{ position:absolute; left:50%; top:48%; width:74px; height:74px; transform:translate(-50%,-50%);
    z-index:6; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 38% 32%, #ff9a3c, #e8681a 60%, #b64c0f 100%);
    box-shadow:0 6px 14px rgba(120,50,10,.45), inset 0 -6px 10px rgba(120,40,6,.5), inset 0 4px 8px rgba(255,210,150,.6);
    font-size:30px; line-height:1; transition:transform .5s ease, opacity .5s ease;
  }
  .seal span{ filter:drop-shadow(0 1px 1px rgba(120,40,6,.5)); }
  /* washi tape */
  .tape{ position:absolute; width:104px; height:30px; background:rgba(240,205,120,.5);
    box-shadow:0 2px 6px rgba(80,54,20,.2); border-left:1px dashed rgba(255,255,255,.4); border-right:1px dashed rgba(255,255,255,.4); }
  .tape.t1{ top:-12px; left:-18px; transform:rotate(-24deg); background:rgba(239,127,26,.34); }
  .tape.t2{ bottom:-10px; right:-16px; transform:rotate(-20deg); background:rgba(154,106,174,.32); }

  .tap-cta{ font-family:"Be Vietnam Pro",sans-serif; font-weight:400; font-size:clamp(13px,1.9vw,15px);
    color:#6c5836; display:flex; align-items:center; gap:9px; opacity:.9; }
  .tap-cta .dot{ width:9px; height:9px; border-radius:50%; background:var(--orange); box-shadow:0 0 0 0 rgba(239,127,26,.5);
    animation:pulse 1.8s ease-out infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(239,127,26,.5)} 100%{box-shadow:0 0 0 14px rgba(239,127,26,0)} }

  /* opening choreography */
  #intro.opening .flap{ transform:rotateX(178deg); }
  #intro.opening .seal{ transform:translate(-50%,-50%) scale(.4) translateY(-30px); opacity:0; }
  #intro.opening .letter{ transform:translateY(-66%); }
  #intro.opening .tap-cta{ opacity:0; transition:opacity .3s; }

  /* floating dust on intro */
  .dust{ position:absolute; border-radius:50%; background:rgba(255,236,190,.9); pointer-events:none;
    filter:blur(.3px); animation:floatUp linear infinite; opacity:0; }
  @keyframes floatUp{ 0%{ transform:translateY(20px) translateX(0); opacity:0 }
    10%{opacity:.8} 90%{opacity:.5} 100%{ transform:translateY(-70vh) translateX(var(--dx)); opacity:0 } }

  @media (prefers-reduced-motion: reduce){
    #rays,#grain{ animation:none; }
  }
  .noselect{ user-select:none; }
</style>
</head>
<body class="noselect">

  <div id="ambient"></div>

  <div id="frameCenter">
    <div id="frame">
      <img id="poster" src="assets/poster.webp" alt="Poster chúc mừng tốt nghiệp Orenji" />
      <img id="girl" src="assets/girl.webp" alt="" />
    </div>
  </div>

  <canvas id="fxBack"></canvas>
  <canvas id="fxFront"></canvas>

  <div id="rays"></div>
  <div id="vignette"></div>
  <div id="grain"></div>

  <div id="ui">
    <div class="btn" id="muteBtn" title="Bật / tắt nhạc" role="button" aria-label="Bật tắt nhạc">
      <svg id="icon-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8 8 0 0 1 0 12"/>
      </svg>
    </div>
    <div id="hint">Di chuột hoặc nghiêng máy để nhìn 3D ✨</div>
    <div id="signature">— chúc mừng cậu, tân cử nhân 🍊</div>
  </div>

  <!-- INTRO -->
  <div id="intro">
    <div class="paper-grain"></div>
    <div class="intro-stack">
      <div class="kicker">Gửi <b>Orenji</b> 🍊</div>
      <div class="env" id="env">
        <div class="tape t1"></div>
        <div class="tape t2"></div>
        <div class="env-body">
          <div class="env-seam"></div>
        </div>
        <div class="letter">
          <div class="l-title">Một điều nhỏ dành cho cậu</div>
          <div class="l-sub">nhân ngày cậu tốt nghiệp</div>
          <div class="l-orange">Happy Graduation</div>
        </div>
        <div class="pocket"></div>
        <div class="flap"></div>
        <div class="seal"><span>🍊</span></div>
      </div>
      <div class="tap-cta"><span class="dot"></span> Chạm để mở thư</div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PALETTE = ["#ef7f1a","#ff9c3d","#d7a521","#f1cf5f","#b23a34","#9a6aae","#7f9c6b","#fbf4e4","#231a10"];

  /* ============================================================= *
   *  PARALLAX  — poster + girl tilt in opposite depths            *
   * ============================================================= */
  const frame  = document.getElementById("frame");
  const poster = document.getElementById("poster");
  const girl   = document.getElementById("girl");
  let tx=0, ty=0, cx=0, cy=0;           // target vs current (smoothed)
  function onPointer(px, py){
    const w=innerWidth, h=innerHeight;
    tx = (px/w - .5)*2;                 // -1..1
    ty = (py/h - .5)*2;
  }
  window.addEventListener("mousemove", e=>onPointer(e.clientX, e.clientY), {passive:true});
  window.addEventListener("touchmove", e=>{ if(e.touches[0]) onPointer(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  // device tilt
  function handleTilt(e){
    if(e.gamma==null||e.beta==null) return;
    const g=Math.max(-1,Math.min(1, e.gamma/28));       // left-right
    const b=Math.max(-1,Math.min(1, (e.beta-40)/28));   // front-back
    tx=g; ty=b;
  }
  function enableTilt(){ window.addEventListener("deviceorientation", handleTilt, {passive:true}); }

  function tickParallax(){
    cx += (tx-cx)*0.06; cy += (ty-cy)*0.06;
    const rx = (-cy*3.4).toFixed(3), ry=(cx*4.6).toFixed(3);
    poster.style.transform =
      `perspective(1400px) rotateX(${rx}deg) rotateY(${ry}deg) translate(${(-cx*10).toFixed(1)}px,${(-cy*7).toFixed(1)}px) scale(1.015)`;
    girl.style.transform =
      `perspective(1400px) rotateX(${(-cy*2).toFixed(3)}deg) rotateY(${(cx*3).toFixed(3)}deg) translate(${(-cx*30).toFixed(1)}px,${(-cy*20).toFixed(1)}px) scale(1.05)`;
  }

  /* ============================================================= *
   *  PARTICLES — the "tuôn trào" pour-out                          *
   * ============================================================= */
  const cvBack=document.getElementById("fxBack"), cvFront=document.getElementById("fxFront");
  const ctxB=cvBack.getContext("2d"), ctxF=cvFront.getContext("2d");
  let DPR=Math.min(2, window.devicePixelRatio||1), W=0, H=0;
  function resize(){
    W=innerWidth; H=innerHeight;
    for(const cv of [cvBack,cvFront]){ cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px"; }
    ctxB.setTransform(DPR,0,0,DPR,0,0); ctxF.setTransform(DPR,0,0,DPR,0,0);
    placeGirl();
  }
  // emitter = around the girl's chest, derived from her on-screen rect
  function emitter(){
    const r=girl.getBoundingClientRect();
    return { x:r.left + r.width*0.5, y:r.top + r.height*0.42, spread:Math.max(r.width,120) };
  }

  function rnd(a,b){ return a+Math.random()*(b-a); }
  function pick(a){ return a[(Math.random()*a.length)|0]; }

  function makeParticle(front, burst){
    const e=emitter();
    const ang=rnd(0,Math.PI*2);
    const rad=rnd(0, e.spread*0.5);
    const kinds=["confetti","confetti","petal","spark","cap","confetti"];
    const kind=pick(kinds);
    const speed=(burst?rnd(3.2,7.5):rnd(0.7,2.6))*(front?1.25:0.7);
    return {
      kind, front,
      x:e.x+Math.cos(ang)*rad*0.3, y:e.y+Math.sin(ang)*rad*0.3,
      vx:Math.cos(ang)*speed + (Math.random()-.5)*0.6,
      vy:Math.sin(ang)*speed - rnd(0.4,1.8),      // slight upward bias => "gushing up & out"
      g:rnd(0.015,0.05),
      z:front?rnd(0.35,0.7):rnd(0.5,0.9),          // scale seed
      dz:front?rnd(0.006,0.016):rnd(0.001,0.004),  // growth toward viewer
      rot:rnd(0,Math.PI*2), vr:rnd(-0.16,0.16),
      color:pick(PALETTE), size:rnd(7,15)*(front?1.15:0.85),
      life:0, max:front?rnd(90,150):rnd(160,300),
      tw:rnd(0,Math.PI*2)
    };
  }

  const front=[], back=[];
  function seed(){
    for(let i=0;i<46;i++) back.push(makeParticle(false,false));
  }
  function burst(n){ for(let i=0;i<n;i++) front.push(makeParticle(true,true)); }

  function drawParticle(ctx,p){
    const s=p.size*p.z;
    const a=Math.min(1, p.life<10? p.life/10 : (p.max-p.life)/28);
    ctx.save();
    ctx.globalAlpha=Math.max(0,a)*(p.front?0.96:0.8);
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    if(p.kind==="confetti"){
      ctx.fillStyle=p.color;
      ctx.fillRect(-s*0.5,-s*0.32,s,s*0.64);
      ctx.globalAlpha*=0.35; ctx.fillStyle="rgba(255,255,255,.6)";
      ctx.fillRect(-s*0.5,-s*0.32,s,s*0.18);
    } else if(p.kind==="petal"){
      ctx.fillStyle=Math.random()<0.5?"#ff9c3d":"#f2b98a";
      ctx.beginPath(); ctx.ellipse(0,0,s*0.6,s*0.32,0,0,Math.PI*2); ctx.fill();
    } else if(p.kind==="spark"){
      const g=s*0.9; ctx.fillStyle="rgba(255,224,150,.95)";
      ctx.beginPath();
      for(let i=0;i<8;i++){ const r=i%2? g*0.32:g; const ā=i*Math.PI/4;
        ctx[i?"lineTo":"moveTo"](Math.cos(ā)*r,Math.sin(ā)*r); }
      ctx.closePath(); ctx.fill();
    } else if(p.kind==="cap"){
      const c=s*0.9; ctx.fillStyle="#1c1712";
      ctx.beginPath(); // mortarboard diamond
      ctx.moveTo(0,-c*0.5); ctx.lineTo(c,0); ctx.lineTo(0,c*0.5); ctx.lineTo(-c,0); ctx.closePath(); ctx.fill();
      ctx.fillRect(-c*0.42,0,c*0.84,c*0.34);
      ctx.strokeStyle="#d7a521"; ctx.lineWidth=Math.max(1,s*0.08);
      ctx.beginPath(); ctx.moveTo(c*0.7,0); ctx.lineTo(c*0.7,c*0.7); ctx.stroke();
    }
    ctx.restore();
  }

  function stepPool(pool, ctx, isFront){
    for(let i=pool.length-1;i>=0;i--){
      const p=pool[i];
      p.life++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.z+=p.dz;
      if(p.kind==="spark"){ p.tw+=0.2; }
      drawParticle(ctx,p);
      const off = p.y> H+80 || p.x<-80 || p.x>W+80 || p.life>p.max || p.z>2.2;
      if(off){
        if(isFront) pool.splice(i,1);
        else Object.assign(p, makeParticle(false,false)); // recycle ambient
      }
    }
  }

  let running=false, emitAcc=0;
  function loop(){
    if(!running) return;
    ctxB.clearRect(0,0,W,H); ctxF.clearRect(0,0,W,H);
    tickParallax();
    stepPool(back, ctxB, false);
    // steady gentle emission of front pour
    emitAcc+=1;
    if(emitAcc>=3 && front.length<160){ front.push(makeParticle(true,false)); emitAcc=0; }
    stepPool(front, ctxF, true);
    requestAnimationFrame(loop);
  }

  /* ============================================================= *
   *  MUSIC — original music-box lullaby via Web Audio             *
   *  (self-contained; drop assets/music.mp3 to override)          *
   * ============================================================= */
  const Music=(function(){
    let ctx=null, master=null, conv=null, padGain=null, timer=null, started=false, muted=false;
    let htmlAudio=null;
    const A=440;
    const N=n=>A*Math.pow(2,(n-9)/12); // n=0 => C4
    // C major family; melody indices are semitone steps from C4
    const CH = [ // I  V6  vi  IV  (warm, hopeful)
      [ -12,0,4,7 ], [ -8,-1,2,7 ], [ -3,0,4,9 ], [ -7,0,5,9 ]
    ];
    const MEL = [ // per bar: [step, beat, dur]
      [ [12,0,1.5],[7,1.5,.5],[9,2,1],[12,3,1] ],
      [ [11,0,1],[7,1,1],[9,2,1.5],[4,3.5,.5] ],
      [ [9,0,1],[12,1,1],[16,2,1.5],[12,3.5,.5] ],
      [ [14,0,1],[12,1,1],[9,2,1],[7,3,1] ]
    ];
    const BEAT=0.62; let bar=0, nextTime=0;

    function makeReverb(){
      const len=ctx.sampleRate*1.8, buf=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let c=0;c<2;c++){ const d=buf.getChannelData(c);
        for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); } }
      const cv=ctx.createConvolver(); cv.buffer=buf; return cv;
    }
    function voice(freq,t,dur,gain,type){
      const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
      o.type=type||"triangle"; o2.type="sine";
      o.frequency.value=freq; o2.frequency.value=freq*2.001;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(gain,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); o2.connect(g);
      g.connect(master); g.connect(conv);
      o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
    }
    function pad(freqs,t,dur){
      freqs.forEach(f=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type="sine"; o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(0.02,t+0.6);
        g.gain.linearRampToValueAtTime(0.0001,t+dur);
        o.connect(g); g.connect(padGain); o.start(t); o.stop(t+dur+0.1);
      });
    }
    function scheduleBar(){
      const chord=CH[bar%4], mel=MEL[bar%4], t0=nextTime;
      pad(chord.map(s=>N(s)/1), t0, BEAT*4);
      // arpeggio sparkle
      chord.forEach((s,i)=> voice(N(s+12), t0+i*0.14, 0.9, 0.05, "sine"));
      mel.forEach(([step,beat,dur])=> voice(N(step), t0+beat*BEAT, dur*BEAT*1.4, 0.12, "triangle"));
      bar++; nextTime+=BEAT*4;
    }
    function scheduler(){
      while(nextTime < ctx.currentTime + 1.2) scheduleBar();
    }
    async function tryHtml(){
      // if a real track exists, prefer it
      return new Promise(res=>{
        const a=new Audio("assets/music.mp3"); a.loop=true; a.volume=0.0;
        a.addEventListener("canplaythrough",()=>res(a),{once:true});
        a.addEventListener("error",()=>res(null),{once:true});
        setTimeout(()=>res(null),1200);
      });
    }
    async function start(){
      if(started) return; started=true;
      htmlAudio=await tryHtml();
      if(htmlAudio){
        htmlAudio.play().catch(()=>{});
        let v=0; const iv=setInterval(()=>{ v=Math.min(0.7,v+0.05); htmlAudio.volume=muted?0:v; if(v>=0.7)clearInterval(iv);},60);
        return;
      }
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=0.0;
      padGain=ctx.createGain(); padGain.gain.value=0.6; padGain.connect(master);
      conv=makeReverb(); const cg=ctx.createGain(); cg.gain.value=0.5; conv.connect(cg); cg.connect(ctx.destination);
      master.connect(ctx.destination);
      nextTime=ctx.currentTime+0.15;
      master.gain.linearRampToValueAtTime(muted?0:0.22, ctx.currentTime+3.2);
      scheduler(); timer=setInterval(scheduler,260);
    }
    function setMute(m){
      muted=m;
      if(htmlAudio){ htmlAudio.volume=m?0:0.7; return; }
      if(master) master.gain.linearRampToValueAtTime(m?0:0.22, (ctx?ctx.currentTime:0)+0.25);
    }
    return { start, setMute, isMuted:()=>muted };
  })();

  /* ============================================================= *
   *  BOOT / INTRO                                                  *
   * ============================================================= */
  function placeGirl(){ /* percentages in CSS handle it; hook kept for resize */ }
  window.addEventListener("resize", resize, {passive:true});

  const intro=document.getElementById("intro");
  const hint=document.getElementById("hint");
  const signature=document.getElementById("signature");
  let opened=false;

  function spawnDust(){
    for(let i=0;i<16;i++){
      const d=document.createElement("div"); d.className="dust";
      const s=rnd(2,6);
      d.style.width=d.style.height=s+"px";
      d.style.left=rnd(0,100)+"%"; d.style.bottom=rnd(-10,30)+"%";
      d.style.setProperty("--dx",(rnd(-40,40))+"px");
      d.style.animationDuration=rnd(7,15)+"s"; d.style.animationDelay=rnd(0,8)+"s";
      intro.appendChild(d);
    }
  }

  function openLetter(){
    if(opened) return; opened=true;
    // audio must start from this gesture
    Music.start();
    // enable device tilt (needs gesture on iOS)
    if(typeof DeviceOrientationEvent!=="undefined" && DeviceOrientationEvent.requestPermission){
      DeviceOrientationEvent.requestPermission().then(p=>{ if(p==="granted") enableTilt(); }).catch(()=>{});
    } else enableTilt();

    intro.classList.add("opening");
    running=true; loop();
    setTimeout(()=>{
      intro.classList.add("gone");
      burst(reduceMotion?24:90);
      setTimeout(()=>{ intro.style.display="none"; }, 1200);
      hint.classList.add("show");
      setTimeout(()=>hint.classList.add("fade"), 5200);
      setTimeout(()=>signature.classList.add("show"), 1600);
    }, 1000);
  }
  intro.addEventListener("click", openLetter);
  intro.addEventListener("touchend", e=>{ e.preventDefault(); openLetter(); }, {passive:false});

  // mute toggle
  const muteBtn=document.getElementById("muteBtn");
  let muted=false;
  muteBtn.addEventListener("click", (e)=>{
    e.stopPropagation(); muted=!muted; Music.setMute(muted);
    muteBtn.style.opacity=muted?0.5:1;
    muteBtn.querySelector("svg").style.opacity=muted?0.55:1;
  });

  resize(); spawnDust();
})();
</script>
</body>
